<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CarbonCore — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --black: #0a0a0a; --surface: #141414; --surface2: #1c1c1c; --border: #2a2a2a;
  --cyan: #00e5cc; --text: #f0f0f0; --muted: #666;
}
body { background: var(--black); color: var(--text); font-family: 'DM Sans', sans-serif; font-weight: 300; min-height: 100vh; }
.page { max-width: 900px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }
.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; border-bottom: 1px solid var(--border); padding-bottom: 1.5rem; }
.logo { font-family: 'Bebas Neue', sans-serif; font-size: 28px; letter-spacing: 0.08em; }
.logo span { color: var(--cyan); }
.count { font-size: 12px; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; }
.count strong { color: var(--cyan); }
.loading { text-align: center; padding: 4rem; color: var(--muted); font-size: 14px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 1.5rem; margin-bottom: 1rem; display: grid; grid-template-columns: 1fr auto; gap: 1.5rem; align-items: start; }
.card-info { }
.card-name { font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 0.06em; color: var(--text); margin-bottom: 0.5rem; }
.card-detail { font-size: 13px; color: var(--muted); margin-bottom: 0.25rem; }
.card-detail span { color: #999; }
.card-date { font-size: 11px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; margin-top: 0.75rem; border-top: 1px solid var(--border); padding-top: 0.75rem; }
.sig-img { width: 200px; height: 80px; border: 1px solid var(--border); border-radius: 4px; background: var(--surface2); object-fit: contain; }
.sig-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 6px; text-align: center; }
.no-sig { width: 200px; height: 80px; border: 1px solid var(--border); border-radius: 4px; background: var(--surface2); display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--muted); }
.empty { text-align: center; padding: 4rem; color: var(--muted); }
@media (max-width: 500px) { .card { grid-template-columns: 1fr; } .sig-img, .no-sig { width: 100%; } }
</style>
</head>
<body>
<div class="page">
  <div class="header">
    <div class="logo">CARBON<span>CORE</span> <span style="font-size:14px; color: var(--muted); font-family: 'DM Sans'; font-weight:300; letter-spacing:0.15em; text-transform:uppercase;">Admin</span></div>
    <div class="count" id="count">Зарежда...</div>
  </div>
  <div id="list"><div class="loading">Зарежда декларации...</div></div>
</div>

<script>
const SUPABASE_URL = 'https://kqbbcaramzpxejzdfjoe.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtxYmJjYXJhbXpweGVqemRmam9lIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE3NzM4ODgsImV4cCI6MjA5NzM0OTg4OH0.CIC7LhPslMTlF3jG9L1aeoh-32hKBIzmeyX0h1MjIiA';

async function load() {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/sasie?select=*&order=created_at.desc`, {
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
  });
  const data = await res.json();
  const list = document.getElementById('list');
  const count = document.getElementById('count');

  if (!data.length) {
    list.innerHTML = '<div class="empty">Все още няма попълнени декларации.</div>';
    count.innerHTML = '<strong>0</strong> декларации';
    return;
  }

  count.innerHTML = `<strong>${data.length}</strong> декларации`;

  list.innerHTML = data.map(r => {
    const date = new Date(r.created_at).toLocaleDateString('bg-BG', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    const sigHtml = r.podpis
      ? `<div><div class="sig-label">Подпис</div><img class="sig-img" src="${r.podpis}" alt="подпис" /></div>`
      : `<div><div class="sig-label">Подпис</div><div class="no-sig">Няма подпис</div></div>`;
    return `
      <div class="card">
        <div class="card-info">
          <div class="card-name">${r.ime || '—'}</div>
          <div class="card-detail">📍 <span>${r.grad || '—'}</span></div>
          <div class="card-detail">📞 <span>${r.tel || '—'}</span></div>
          <div class="card-detail">📅 <span>Дата на декларация: ${r.data || '—'}</span></div>
          <div class="card-date">Записано: ${date}</div>
        </div>
        ${sigHtml}
      </div>`;
  }).join('');
}

load();
</script>
</body>
</html>
